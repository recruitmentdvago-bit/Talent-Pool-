            mis analyst, insights analyst, analytics analyst, business analyst - data,
            mis officer, reporting specialist, head of business intelligence,
            head of analytics, head of mis, analytics manager, bi manager, mis manager,
            business intelligence manager, reporting manager, analytics lead, insights manager]
  adjacent: [data_scientist, data_engineer, business_analyst, bi_developer]
  core_skills: [sql, excel, data_analysis, power_bi, tableau]
