<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Dvago Talent Pool</title>
<link rel="icon" href="/static/brand/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/static/brand/favicon.png">
<link rel="apple-touch-icon" href="/static/brand/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#f4f8ef; --panel:#fff; --ink:#15210f; --muted:#5d6b54; --line:#dfe8d6;
  --brand:#4cb003; --brand-hi:#58bd0b; --brand-lo:#3b8f00; --brand-text:#2f7a00; --brand-ink:#fff; --tint:#eaf6dd;
  --bad:#b42318; --bad-bg:#fde8e6; --shadow:0 1px 2px rgba(21,33,15,.06),0 12px 40px rgba(47,122,0,.10);
  --hero-a:#58bd0b; --hero-b:#2d7a00;
}
:root[data-theme=dark]{
  --bg:#0d140b; --panel:#141d11; --ink:#e8f1e1; --muted:#9bac90; --line:#26331f;
  --brand:#5bc10a; --brand-hi:#6fd21a; --brand-lo:#4cb003; --brand-text:#86dc3d; --brand-ink:#0b1607; --tint:#1a2a12;
  --bad:#ff8a80; --bad-bg:#3b1a17; --shadow:none; --hero-a:#3f9a00; --hero-b:#173b00;}
*{box-sizing:border-box} html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;
  display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
.hero{position:relative;overflow:hidden;color:#fff;padding:56px 56px 48px;display:flex;flex-direction:column;justify-content:flex-end;
  background:radial-gradient(120% 90% at 85% 8%,var(--hero-a) 0%,var(--hero-b) 70%)}
.hero::before{content:"";position:absolute;right:-12%;top:-8%;width:78%;aspect-ratio:1;background:rgba(255,255,255,.13);
  -webkit-mask:url(/static/brand/heart.png) center/contain no-repeat;mask:url(/static/brand/heart.png) center/contain no-repeat}
.hero::after{content:"";position:absolute;left:-18%;bottom:-30%;width:70%;aspect-ratio:1;background:rgba(255,255,255,.07);
  -webkit-mask:url(/static/brand/heart.png) center/contain no-repeat;mask:url(/static/brand/heart.png) center/contain no-repeat}
.hero>*{position:relative;z-index:1}
.hero h2{font-size:clamp(28px,3.2vw,42px);line-height:1.12;margin:0 0 14px;letter-spacing:-.02em;font-weight:800;text-wrap:balance;max-width:14ch}
.hero p{margin:0;max-width:40ch;font-size:16px;color:rgba(255,255,255,.88)}
.hero .tag{margin-top:28px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:rgba(255,255,255,.75)}
.side{display:flex;align-items:center;justify-content:center;padding:32px max(20px,env(safe-area-inset-right,0px)) 32px max(20px,env(safe-area-inset-left,0px))}
.box{width:min(400px,100%)}
.logo{position:relative;width:min(300px,80%);margin:0 auto 34px;aspect-ratio:1196/270}
.logo img{position:absolute;inset:0;width:100%;height:100%}
.logo .heart{transform-origin:32.4% 50%;animation:beat 2.6s ease-in-out infinite}
@keyframes beat{0%,60%,100%{transform:scale(1)}10%{transform:scale(1.07)}22%{transform:scale(.99)}32%{transform:scale(1.045)}}
@media (prefers-reduced-motion:reduce){.logo .heart{animation:none}}
h1{font-size:24px;margin:0 0 4px;letter-spacing:-.015em;font-weight:800;text-align:center}
p.sub{color:var(--muted);font-size:14px;text-align:center;margin:0 0 26px}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:600;margin-bottom:16px}
input{border:1.5px solid var(--line);background:var(--panel);border-radius:12px;padding:12px 14px;font:inherit;font-size:15px;color:var(--ink);width:100%;transition:border-color .15s,box-shadow .15s}
input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 22%,transparent)}
button{width:100%;border:0;background:linear-gradient(180deg,var(--brand-hi),var(--brand));color:var(--brand-ink);padding:13px;border-radius:12px;font:inherit;font-weight:700;font-size:15px;cursor:pointer;margin-top:4px;
  box-shadow:0 6px 16px -6px color-mix(in srgb,var(--brand) 70%,transparent);transition:transform .08s,filter .15s}
button:hover{filter:brightness(1.05)} button:active{transform:translateY(1px)} button:disabled{opacity:.6;cursor:wait}
.err{background:var(--bad-bg);color:var(--bad);padding:10px 14px;border-radius:12px;font-size:13px;font-weight:600;margin-bottom:16px;display:none;text-align:center}
.foot{margin-top:28px;text-align:center;font-size:12px;color:var(--muted)}
@media(max-width:860px){body{grid-template-columns:1fr}.hero{display:none}}
</style>
</head>
<body>
<section class="hero" aria-hidden="true">
  <h2>Hiring that puts people first.</h2>
  <p>Every shortlisted profile, scored against your vacancies and filed for the right department head.</p>
  <div class="tag">Dvago · Talent Pool</div>
</section>
<main class="side">
  <div class="box">
    <div class="logo" role="img" aria-label="Dvago">
      <img src="/static/brand/logo-rest.png" alt="">
      <img class="heart" src="/static/brand/logo-heart.png" alt="">
    </div>
    <h1>Welcome back</h1>
    <p class="sub">Sign in to the Talent Pool</p>
    <div class="err" id="err" role="alert"></div>
    <form id="f" autocomplete="on">
      <label>Username<input type="text" name="username" id="u" autofocus autocomplete="username" required></label>
      <label>Password<input type="password" name="password" id="p" autocomplete="current-password" required></label>
      <button type="submit" id="go">Sign in</button>
    </form>
    <div class="foot">Trouble signing in? Ask HR to reset your password.</div>
  </div>
</main>
<script>
document.getElementById("f").onsubmit = async e => {
  e.preventDefault();
  const err = document.getElementById("err"), go = document.getElementById("go");
  err.style.display = "none"; go.disabled = true;
  try {
    const r = await fetch("/api/login", {method:"POST", headers:{"Content-Type":"application/json","X-Sourcer-UI":"1"},
      body: JSON.stringify({username: document.getElementById("u").value, password: document.getElementById("p").value})});
    const d = await r.json();
    if (d.ok) { location.href = "/"; return; }
    err.textContent = d.error || "Sign in failed"; err.style.display = "block";
  } catch (ex) { err.textContent = "Cannot reach the app. Is it still running?"; err.style.display = "block"; }
  go.disabled = false;
};
</script>
</body>
</html>
